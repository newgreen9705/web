<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>線上詢價 | 新懋鋁業股份有限公司</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <!-- Google reCAPTCHA API 腳本 -->
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body>

    <!-- 頂部導覽列 -->
    <header class="navbar-glass">
        <div class="container nav-wrapper">
            <a href="index.html" class="logo">
                <img src="images/logo.png" alt="新懋鋁業 LOGO" class="logo-img">
                <span class="logo-text">
                    新懋鋁業股份有限公司
                    <span>New-Green Aluminium CO., LTD.</span>
                </span>
            </a>
            <nav class="nav-links">
                <a href="index.html" class="nav-item">回首頁</a>
                <a href="about.html" class="nav-item">關於新懋</a>
                <a href="products.html" class="nav-item">鋁材與加工服務</a>
                <a href="locations.html" class="nav-item">全台據點地圖</a>
                <a href="faq.html" class="nav-item">常見問題</a>
                <a href="quote.html" class="btn-primary-glow active">線上詢價</a>
            </nav>
        </div>
    </header>

    <!-- 主頁頭區塊 (純圖片背景) -->
    <section class="quote-header-bg">
        <div class="container">
            <span class="badge-tech"><i class="fas fa-calculator"></i> ONLINE QUOTE</span>
            <h1 style="font-size: 36px; margin-top: 10px; font-weight: 700;">快速線上詢價</h1>
            <p style="color: #ffffff; font-size: 16px; margin-top: 8px;">填寫您的材料需求與加工規格，我們將安排專人盡速為您報價與回覆。</p>
        </div>
    </section>

    <!-- 詢價表單區塊 -->
    <section class="section-padding">
        <div class="container" style="max-width: 800px;">
            <div class="quote-form-card" style="background: #ffffff; border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 40px; box-shadow: var(--shadow-sm);">
                
                <div class="section-title-center" style="margin-bottom: 30px; text-align: left;">
                    <h2 style="font-size: 24px; color: var(--dark-bg); margin-bottom: 5px;">填寫詢價需求單</h2>
                    <p style="color: var(--text-muted); font-size: 14px;">請留下您的聯絡資訊與詳細規格（如合金牌號、厚度、尺寸、數量及鋸切/銑面需求），我們將盡快與您聯繫。</p>
                </div>

                <form id="quoteForm">
                    <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-bottom: 20px;">
                        <div class="form-group">
                            <label style="display: block; font-size: 14px; font-weight: 600; color: var(--dark-bg); margin-bottom: 8px;">公司名稱 <span style="color: #dc2626;">*</span></label>
                            <input type="text" name="company" required placeholder="請輸入公司或行號名稱" style="width: 100%; padding: 12px 15px; border: 1px solid var(--border-color); border-radius: var(--radius-sm); font-size: 14px;">
                        </div>
                        <div class="form-group">
                            <label style="display: block; font-size: 14px; font-weight: 600; color: var(--dark-bg); margin-bottom: 8px;">聯絡人姓名 <span style="color: #dc2626;">*</span></label>
                            <input type="text" name="contact" required placeholder="請輸入您的大名" style="width: 100%; padding: 12px 15px; border: 1px solid var(--border-color); border-radius: var(--radius-sm); font-size: 14px;">
                        </div>
                    </div>

                    <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-bottom: 20px;">
                        <div class="form-group">
                            <label style="display: block; font-size: 14px; font-weight: 600; color: var(--dark-bg); margin-bottom: 8px;">聯絡電話 <span style="color: #dc2626;">*</span></label>
                            <input type="tel" name="phone" required placeholder="例如：04-12345678 或手機" style="width: 100%; padding: 12px 15px; border: 1px solid var(--border-color); border-radius: var(--radius-sm); font-size: 14px;">
                        </div>
                        <div class="form-group">
                            <label style="display: block; font-size: 14px; font-weight: 600; color: var(--dark-bg); margin-bottom: 8px;">電子郵件 <span style="color: #dc2626;">*</span></label>
                            <input type="email" name="email" required placeholder="example@company.com.tw" style="width: 100%; padding: 12px 15px; border: 1px solid var(--border-color); border-radius: var(--radius-sm); font-size: 14px;">
                        </div>
                    </div>

                    <div class="form-group" style="margin-bottom: 25px;">
                        <label style="display: block; font-size: 14px; font-weight: 600; color: var(--dark-bg); margin-bottom: 8px;">需求說明與規格明細 <span style="color: #dc2626;">*</span></label>
                        <textarea name="notes" rows="6" required placeholder="請詳細填寫：
1. 需求材質（如：5052、6061-T651、7075等）
2. 尺寸與厚度（如：板厚 20mm x 寬 500mm x 長 1000mm）
3. 數量與加工需求（如：精準鋸切、雙面銑面、覆膜等）" style="width: 100%; padding: 12px 15px; border: 1px solid var(--border-color); border-radius: var(--radius-sm); font-size: 14px; resize: vertical;"></textarea>
                    </div>

                    <!-- Google reCAPTCHA 驗證區塊 -->
                    <div class="form-group" style="margin-bottom: 25px;">
                        <!-- 測試用 Key (上線前請更換為您自己的 Google reCAPTCHA 網站金鑰) -->
                        <div class="g-recaptcha" data-sitekey="6LcUrGotAAAAAF7h3W5P95nVVsFPzbUJebLAe-Cr"></div>
                    </div>

                    <button type="submit" class="btn-primary-glow" style="width: 100%; padding: 15px; font-size: 16px; font-weight: 600; justify-content: center; border: none; cursor: pointer; border-radius: var(--radius-sm);">
                        <i class="fas fa-paper-plane"></i> 送出詢價需求
                    </button>
                </form>

            </div>
        </div>
    </section>

    <!-- 頁尾 -->
    <footer class="footer-dark">
        <div class="container footer-copyright">
            <p>&copy; 2026 新懋鋁業股份有限公司 All Rights Reserved.</p>
        </div>
    </footer>

    <!-- 表單送出與驗證 JavaScript -->
<script>
        document.getElementById('quoteForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // 檢查 reCAPTCHA 是否已勾選
            var recaptchaResponse = grecaptcha.getResponse();
            if (recaptchaResponse.length === 0) {
                alert('請勾選「我不是機器人」驗證！');
                return;
            }

            var submitBtn = this.querySelector('button[type="submit"]');
            var originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 傳送中...';
            submitBtn.disabled = true;

            var formData = new FormData(this);
            var formElement = this; // 保留表單物件參考

            fetch('send_mail.php', {
                method: 'POST',
                body: formData
            })
            .then(function(response) {
                return response.json();
            })
            .then(function(data) {
                alert(data.message);
                if(data.status === 'success') {
                    formElement.reset();
                    grecaptcha.reset(); // 成功後重置驗證方塊
                }
            })
            .catch(function(error) {
                alert('系統連線異常或伺服器未設定 PHP，請稍後再試或直接來電與我們聯繫。');
            })
            .finally(function() {
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            });
        });
    </script>
</body>
</html>
